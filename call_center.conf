Alias /call_center /var/www/html/call_center/public

<Directory /var/www/html/call_center/public>
    AllowOverride All
    Require all granted
    Options -Indexes
    RewriteEngine On
    RewriteBase /call_center/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]
</Directory>

# Static assets — served directly by Apache, no proxy
ProxyPassMatch ^/call_center/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ !

# Everything else — forward to Laravel via PHP-FPM
ProxyPassMatch ^/call_center(/.*)?$ fcgi://127.0.0.1:9001/var/www/public/index.php


# inside Apache config :    /etc/httpd/conf.d/call_center.conf